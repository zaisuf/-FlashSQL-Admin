name: Build macOS app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos:
    name: macOS arm64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure code signing (only when the secrets exist)
        env:
          IN_CSC_LINK: ${{ secrets.CSC_LINK }}
          IN_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          IN_APPLE_ID: ${{ secrets.APPLE_ID }}
          IN_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          IN_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$IN_CSC_LINK" ]; then
            echo "CSC_LINK=$IN_CSC_LINK" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$IN_CSC_KEY_PASSWORD" >> "$GITHUB_ENV"
          fi
          if [ -n "$IN_APPLE_ID" ]; then
            echo "APPLE_ID=$IN_APPLE_ID" >> "$GITHUB_ENV"
            echo "APPLE_APP_SPECIFIC_PASSWORD=$IN_APPLE_APP_SPECIFIC_PASSWORD" >> "$GITHUB_ENV"
            echo "APPLE_TEAM_ID=$IN_APPLE_TEAM_ID" >> "$GITHUB_ENV"
          fi
          if [ -n "$IN_CSC_LINK" ]; then
            echo "::notice::Building a signed and notarized app."
          else
            echo "::notice::No signing secrets found - building an unsigned app."
          fi

      - name: Build app
        run: npm run desktop:build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flashsqlstudio-macos-arm64
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    needs: macos
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Attach artifacts to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "Flash SQL Studio ${TAG#v}" --generate-notes
          gh release upload "$TAG" artifacts/* --clobber
